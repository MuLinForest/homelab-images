name: Build caddy-with-dns

on:
  schedule:
    - cron: '0 3 * * *'  # 每天凌晨 3 點檢查上游
  push:
    paths:
      - 'caddy/Dockerfile'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: Check if upstream changed
        id: check
        run: |
          docker pull caddy:latest --platform linux/amd64 -q 2>/dev/null
          DIGEST=$(docker inspect caddy:latest --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          # 用 git tag 記錄上次 build 的 digest
          TAG="caddy-base-$DIGEST"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "上游無變化，跳過 build"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "有新版本，開始 build"
            echo "$DIGEST" > /tmp/digest
          fi
      - name: Tag digest for next check
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.email "bot@mulin.date"
          git config user.name "caddy-bot"
          git tag "caddy-base-$(cat /tmp/digest)"
          git remote add token "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" 2>/dev/null || git remote set-url token "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push token --tags 2>/dev/null

  build:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./caddy
          push: true
          tags: ghcr.io/${{ env.OWNER }}/caddy-with-dns:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
