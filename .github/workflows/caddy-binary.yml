name: Build caddy binary

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: Check if upstream changed
        id: check
        run: |
          docker pull caddy:latest --platform linux/amd64 -q 2>/dev/null
          DIGEST=$(docker inspect caddy:latest --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          TAG="caddy-bin-base-$(echo $DIGEST | tr ':' '-')"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "上游無變化，跳過 build"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "有新版本，開始 build"
            echo "$DIGEST" > /tmp/digest
          fi
      - name: Tag digest for next check
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.email "bot@mulin.date"
          git config user.name "caddy-bot"
          git tag "caddy-bin-base-$(cat /tmp/digest)"
          git remote add token "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push token --tags

  build-binary:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build caddy with plugins
        run: |
          ~/go/bin/xcaddy build v2.11.3 \
            --with github.com/caddy-dns/alidns \
            --with github.com/caddy-dns/cloudflare \
            --with github.com/caddy-dns/dynu \
            --with github.com/caddy-dns/duckdns \
            --output caddy-linux-amd64

      - name: Get version info
        id: version
        run: echo "v=$(./caddy-linux-amd64 version | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy-linux-amd64-${{ steps.version.outputs.v }}
          path: caddy-linux-amd64
